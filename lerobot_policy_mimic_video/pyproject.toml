[project]
name = "lerobot_policy_mimic_video"
version = "0.1.0"
description = "LeRobot policy plugin that runs mimic-video directly inside LeRobot async PolicyServer."
requires-python = ">=3.10"
dependencies = [
  "imageio",
  "imageio-ffmpeg",
  "numpy",
  "pillow",
  "torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_policy_mimic_video"]
